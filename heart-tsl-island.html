<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手語心島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,700&display=swap">
<style>
/* Layout: full-bleed 3D hex archipelago on the left, a cream study panel docked right (bottom sheet on phones).
   Deliberately one warm, light look in every viewer theme: peach sky, cream paper, coral accent, butter-yellow rewards. */
:root{
  color-scheme:light;
  --bg:#FFF8F4;          /* cream paper */
  --card:#FFFFFF;
  --ink:#211D1D;         /* warm near-black */
  --muted:#78685E;
  --line:#F0E2D8;
  --edge:rgba(33,29,29,.16);
  --brick:#DB6A41;       /* coral: the one accent */
  --brick-deep:#B9502C;
  --brick-ink:#FFFFFF;
  --stud:#FCDD6B;        /* butter yellow: rewards */
  --ok:#3E9B5A;
  --bad:#C9452F;
  --chip:#FDF0E7;
  --sky:#F8E4D2;
  --shadow:0 4px 14px rgba(150,90,50,.13);
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Fraunces",Georgia,"Times New Roman",serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;background:var(--sky);overflow:hidden;touch-action:none}
#stage canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--stud);outline-offset:2px}

/* HUD */
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100% - 24px)}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);border:1.5px solid var(--edge);width:max-content;max-width:100%}
.brand-mark{width:38px;height:38px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.1;letter-spacing:.04em;color:var(--brick)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{pointer-events:auto;display:flex;flex-wrap:wrap;gap:6px}
.tool{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--edge);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.tool[aria-pressed="true"]{background:var(--brick);color:#fff;border-color:var(--brick)}
.tool svg{width:16px;height:16px}
.bricks{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:var(--card);border:1.5px solid var(--edge);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-family:var(--f-num);font-style:italic;font-weight:700;font-size:19px;color:var(--brick)}
.bricks svg{width:26px;height:20px}
.hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(33,29,29,.55);color:#fff;font-size:13px;padding:6px 14px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}

/* labels over 3D */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;align-items:center;gap:6px;background:#FFF8F4;color:#211D1D;border:1.5px solid rgba(33,29,29,.18);border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(150,90,50,.18)}
.pin b{font-family:var(--f-num);font-weight:600;color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 4px}
.pin i{font-style:italic;font-family:var(--f-num);font-weight:600;color:#DB6A41;font-size:13px}
.pin.done{background:#FCEA8B}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:700;color:#211D1D;background:rgba(255,255,255,.88);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.me{background:#D7322B;color:#fff}
.tag.story{background:#DB6A41;color:#fff;font-size:12px;padding:2px 9px;border-radius:99px;box-shadow:0 3px 10px rgba(150,90,50,.25)}
.hide-tags .tag:not(.me):not(.story){display:none}

/* panel */
#panel{width:380px;flex:none;display:flex;flex-direction:column;border-left:1.5px solid var(--edge);background:var(--bg);min-height:0}
.p-head{padding-block:16px 12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.p-head h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:4px 0 6px;text-wrap:balance}
.meter{height:12px;border-radius:99px;background:var(--chip);border:1.5px solid var(--edge);overflow:hidden}
.meter span{display:block;height:100%;background:var(--stud);transition:width .5s}
.meter-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;border:1.5px solid var(--edge);background:var(--card);border-radius:10px;padding:7px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--brick);color:var(--brick-ink);border-color:var(--brick)}
.tab{color:var(--muted)}
.tab[aria-selected="true"]{color:#fff}
.p-body{flex:1;overflow:auto;padding-block:12px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;min-height:0}
.isl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.isl:hover{border-color:var(--brick)}
.hexnum{width:40px;height:44px;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:600;font-size:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.isl h3{margin:0;font-size:15px;font-family:var(--f-display)}
.isl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--stud);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.back{align-self:flex-start;border:none;background:none;color:var(--muted);font-size:13px;padding:0}
.sec-title{font-family:var(--f-display);font-size:21px;margin:0;text-wrap:balance}
.meta{font-size:12px;color:var(--muted)}
.prose{font-size:14.5px;line-height:1.75;margin:0}
.keylist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.keylist li{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.55}
.mnemo{background:var(--card);border:2px dashed var(--brick);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}
.mnemo b{display:block;font-size:12px;color:var(--brick);letter-spacing:.08em;margin-bottom:2px}
h4{margin:6px 0 0;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.res{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.res:hover{border-color:var(--brick)}
.face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px;border:2px solid #FFFFFF}
.res div{flex:1;min-width:0}
.res strong{font-size:14px}
.res small{display:block;color:var(--muted);font-size:12px}
.state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.state.ok{background:var(--ok);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.65}
.card b{font-size:12px;color:var(--muted);display:block}
.empty{color:var(--muted);font-size:14px;line-height:1.7;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:16px}

/* modal */
.veil{position:fixed;inset:0;background:rgba(80,45,25,.28);display:grid;place-items:center;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--card);color:var(--ink);border:1.5px solid var(--edge);border-radius:18px;box-shadow:0 18px 40px rgba(120,70,40,.25);padding:20px}
.m-head{display:flex;gap:12px;align-items:center}
.m-head .face{width:52px;height:52px;font-size:20px}
.m-head h3{margin:0;font-family:var(--f-display);font-size:20px}
.m-head small{color:var(--muted)}
.close{margin-left:auto;border:1.5px solid var(--edge);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1}
.bubble{margin-top:12px;background:var(--chip);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7;position:relative}
.q{margin-top:14px;font-weight:700;font-size:15.5px;line-height:1.6}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.opt:hover{border-color:var(--brick)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slot{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tk{border:1.5px solid #E2B94A;border-bottom-width:4px;background:#FFF3C4;color:#211D1D;border-radius:8px;padding:6px 10px;font-weight:700;font-size:14.5px}
.slot .tk{background:#FFE1D2;border-color:#E7A98C}
.tk[disabled]{opacity:.25;cursor:default}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1.5px solid var(--brick-deep);border-bottom-width:4px;background:var(--brick);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink)}
.feedback{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.65}
.feedback.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border:2px solid var(--ok)}
.feedback.no{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:2px solid var(--bad)}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--stud);color:#211D1D;border:1.5px solid #E2B94A;border-radius:12px;padding:8px 16px;font-weight:700;z-index:60;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:opacity .3s}
.cert{text-align:center}
.cert h3{font-family:var(--f-display);font-size:26px;margin:8px 0}
.cert .seal{width:110px;margin:0 auto}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.tut-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--brick)}

/* opening guide */
.tut-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tut-list li{display:flex;gap:12px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:9px 12px}
.tut-ic{width:32px;height:32px;flex:none}
.tut-ic svg{width:32px;height:32px;display:block}
.tut-list div{min-width:0}
.tut-list b{display:block;font-size:14.5px}
.tut-list span:not(.tut-ic){display:block;font-size:13.5px;line-height:1.6;color:var(--muted)}
.tut-foot{font-size:12.5px;color:var(--muted);line-height:1.6;margin:10px 0 0}

/* mini-games */
.reels{display:grid;grid-template-columns:1fr 1.7fr .8fr;gap:8px;margin-top:12px}
.reel{display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0}
.reel button{border:1.5px solid var(--edge);background:var(--card);border-radius:8px;padding:3px;font-size:12px}
.reel .win{background:#FFF3C4;border:1.5px solid #E2B94A;border-radius:10px;min-height:58px;display:grid;place-items:center;font-weight:900;font-size:16px;padding:4px;overflow:hidden;word-break:keep-all}
.reel .win.spin{animation:spinr .12s linear infinite}
.reel small{color:var(--muted);font-size:11px;letter-spacing:.08em}
@keyframes spinr{0%{transform:translateY(-5px);opacity:.55}100%{transform:translateY(5px);opacity:.55}}
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:40px;margin-top:12px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mcell{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 8px;font-size:14px;font-weight:700;text-align:center;min-height:44px}
.mcell.sel{border-color:var(--brick);background:var(--chip)}
.mcell.ok{background:var(--chip);cursor:default}
.mcell.bad{border-color:var(--bad);animation:shake .35s}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:260px;overflow:auto;padding:2px}
.say{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14.5px;line-height:1.55}
.say small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.say.them{align-self:flex-start;background:var(--chip);border-top-left-radius:4px}
.say.me{align-self:flex-end;background:#FFE1D2;border-top-right-radius:4px;animation:pop .35s}
.say.ctx{align-self:center;background:none;color:var(--muted);font-size:13px;text-align:center;max-width:100%}
.text-build{background:#FFFDF6;border:1.5px dashed #E2B94A;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700;line-height:2;min-height:48px;font-size:14.5px}
.text-build b{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.text-build span{display:inline-block;background:#FFF3C4;border-radius:6px;padding:0 7px;margin:2px}
.text-build span.new{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

@media (max-width:760px){
  #app{flex-direction:column}
  #panel{width:auto;height:44%;border-left:none;border-top:1.5px solid var(--edge)}
  .brand h1{font-size:18px}.brand p{display:none}.brand-mark{width:30px;height:30px}
  .tool span{display:none}
  .p-head h2{font-size:19px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============ 內容資料：取自〈第六章 臺灣手語的教與學〉 ============ */
const ISLANDS = [
  {no:"一",name:"政策港",title:"臺灣手語成為部定課程之後",page:"p.188",color:"#D7322B",top:"#F8E6B8",lm:"hall",
   summary:"108年《國家語言發展法》公布施行，臺灣手語成為國家語言之一，並自111學年度起進入國民基本教育。手語進入學校後，真正的挑戰才開始：臺灣手語是自然語言，也是視覺語言，有自己的詞彙、語法、空間結構、非手勢標記、篇章組織與文化慣例。",

function ring(c,rad){const out=[];let q=c.q+DIRS[4][0]*rad,r=c.r+DIRS[4][1]*rad;for(let i=0;i<6;i++)for(let j=0;j<rad;j++){out.push({q,r});q+=DIRS[i][0];r+=DIRS[i][1];}return out;}
function spiral(c,rad){let o=[{q:c.q,r:c.r}];for(let k=1;k<=rad;k++)o=o.concat(ring(c,k));return o;}
function cround(x,y,z){let rx=Math.round(x),ry=Math.round(y),rz=Math.round(z);const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;return{q:rx,r:rz};}
function hline(a,b){const n=hdist(a,b),o=[];for(let i=0;i<=n;i++){const t=n?i/n:0;const ax=a.q,az=a.r,ay=-ax-az,bx=b.q,bz=b.r,by=-bx-bz;o.push(cround(ax+(bx-ax)*t+1e-6,ay+(by-ay)*t+1e-6,az+(bz-az)*t-2e-6));}return o;}

function bfs(from,to,ok=walk){
  const fk=K(from.q,from.r),tk=K(to.q,to.r); if(fk===tk) return [from];

function drawSign(s){
  const x=s.c.getContext("2d"),W=s.c.width,H=s.c.height;
  x.fillStyle=s.bg;x.fillRect(0,0,W,H);x.strokeStyle=s.fg;x.lineWidth=10;x.strokeRect(5,5,W-10,H-10);
  if(s.paint){s.paint(x,W,H);s.t.needsUpdate=true;return;}
  x.fillStyle=s.fg;x.textAlign="center";x.textBaseline="middle";
  const n=s.lines.length,longest=Math.max(...s.lines.map(l=>l.length));
  const fs=Math.min(H*0.78/n/1.12,W*0.84/longest);
  x.font=`700 ${fs}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
  s.lines.forEach((l,i)=>x.fillText(l,W/2,H/2+(i-(n-1)/2)*fs*1.15));
  s.t.needsUpdate=true;
}

centers.forEach((c,i)=>{
  const ct=tiles.get(K(c.q,c.r));
  const nearBridge=t=>nbrs(t).some(n=>n.bridge);
  const cand=ring(c,2).map((h,j)=>({t:tiles.get(K(h.q,h.r)),j})).filter(o=>o.j%3!==1&&!nearBridge(o.t)).map(o=>o.t);
  // spread props around the ring instead of bunching them on one side
  const step=cand.length/PROPS[i].length;
  PROPS[i].forEach((fn,k)=>{
    const t=cand[Math.floor(k*step)]; if(!t) return;
    const g=new THREE.Group();g.position.set(t.wx,0,t.wz);scene.add(g);
    fn(g,t.top+0.08,{out:Math.atan2(t.wx-ct.wx,t.wz-ct.wz)});

const bounce=k=>{const n=7.5625,d=2.75;if(k<1/d)return n*k*k;if(k<2/d)return n*(k-=1.5/d)*k+0.75;if(k<2.5/d)return n*(k-=2.25/d)*k+0.9375;return n*(k-=2.625/d)*k+0.984375;};

function stepAlong(a,dt,speed){

  const n=a.path[0],tx=n.wx,tz=n.wz,ty=n.top+0.08;
  const p=a.g.position,dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
  if(d<0.04){p.set(tx,ty,tz);a.tile=n;a.path.shift();return a.path.length>0;}
  const s=Math.min(d,speed*dt);p.x+=dx/d*s;p.z+=dz/d*s;p.y+= (ty-p.y)*Math.min(1,dt*10);
  const want=Math.atan2(dx,dz);let diff=want-a.g.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));a.g.rotation.y+=diff*Math.min(1,dt*10);
  return true;
}
function animateLimbs(a,moving,t,dt){

  else if(a.sign>0){ // "signing": both hands up in front, alternating
    const k=t*5+a.phase;a.legL.rotation.x*=0.8;a.legR.rotation.x*=0.8;
    a.armL.rotation.x=-1.25+Math.sin(k)*0.35;a.armR.rotation.x=-1.1+Math.cos(k*1.3)*0.4;a.armL.rotation.z=0.25+Math.sin(k*0.7)*0.15;a.armR.rotation.z=-0.25-Math.cos(k*0.9)*0.15;
  } else {[a.legL,a.legR,a.armL,a.armR].forEach(l=>{l.rotation.x*=0.85;l.rotation.z*=0.85;});}
}

        else{const opts=nbrs(a.tile).filter(n=>n.island===a.res.island&&walk(n));if(opts.length)a.path=[opts[Math.floor(rnd()*opts.length)]];a.wait=1.5+rnd()*3;}
      }

function walkTo(tile,cb){

function approach(r){

}

/* picking */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6||e.button!==0){downAt=null;return;}
  downAt=null;
  const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([storyMark].concat(GAMES.map(g=>g.g),actors.map(a=>a.g),landmarkGroups,tileMeshes),true);
  for(const h of hits){
    const u=h.object.userData;
    if(u.game){goGame(u.game);return;}
    if(u.story){if(storyMark.visible){goStory();return;}continue;}
    if(u.resident){approach(u.resident);openIsland(u.resident.island,true);return;}
    if(u.island!==undefined&&!u.tile){openIsland(u.island);return;}
    if(u.tile){if(walk(u.tile))walkTo(u.tile);if(u.tile.island>=0)openIsland(u.tile.island,true);return;}
  }
});

/* time of day */
const TIMES=[{n:"白天",bg:"#F8E4D2",hemi:0.95,sun:1.1,sc:"#FFE9CF",w:"#5EC4CC"},{n:"黃昏",bg:"#F6BE96",hemi:0.7,sun:0.9,sc:"#FFAE72",w:"#55A9BE"},{n:"夜晚",bg:"#2E2C55",hemi:0.4,sun:0.3,sc:"#B9B4FF",w:"#2A4F78",night:true}];

function applyTime(){const T0=TIMES[timeIdx];scene.background.set(T0.bg);scene.fog.color.set(T0.bg);stage.style.background=T0.bg;hemi.intensity=T0.hemi;sun.intensity=T0.sun;sun.color.set(T0.sc);water.material.color.set(T0.w);scene.userData.night=!!T0.night;document.getElementById("tTimeL").textContent=T0.n;}

/* loop */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
if(camera.aspect<1) camera.position.set(0,58,66); // narrow screens: start farther out so the whole ring fits
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  if(!paused){boats.forEach(b=>{b.a+=b.s*dt;b.g.position.set(Math.cos(b.a)*b.r,0.04+Math.sin(T*2+b.r)*0.03,Math.sin(b.a)*b.r);b.g.rotation.y=-b.a;});clouds.forEach(c=>{c.position.x+=dt*0.4;if(c.position.x>40)c.position.x=-40;});}
  animated.forEach(f=>f(T,!paused));
  updateResidents(dt,T);updatePlayer(dt,T);updateFx(dt);
  if(tween){tween.t=Math.min(1,tween.t+dt/0.9);const k=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.fromP,tween.toP,k);controls.target.lerpVectors(tween.fromT,tween.toT,k);if(tween.t>=1)tween=null;}
  else if(follow){const p=player.g.position,d=p.clone().sub(controls.target);d.y=0;controls.target.add(d.multiplyScalar(Math.min(1,dt*3)));camera.position.add(d);}
  // keep the view near the archipelago
  const tg=controls.target;const L=Math.hypot(tg.x,tg.z);if(L>22){const f=22/L,dx=tg.x*(f-1),dz=tg.z*(f-1);tg.x+=dx;tg.z+=dz;camera.position.x+=dx;camera.position.z+=dz;}
  controls.update();updateLabels();renderer.render(scene,camera);requestAnimationFrame(loop);
}
applyTime();requestAnimationFrame(loop);

function qHTML(q){
  return `<div class="q">${esc(q.prompt).replace(/\n/g,"<br>")}</div>`+(q.type==="mc"
    ?`<div class="opts">${shuffle(q.options.map((_,i)=>i)).map((i,pos)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+pos)}．${esc(q.options[i])}</button>`).join("")}</div>`
    :`<div class="slot" id="slot" aria-label="你的排列"></div><div class="pool" id="pool"></div><div class="row"><button class="btn" id="chk">確認</button><button class="btn ghost" id="clr">重排</button></div>`);
}
function bindQuestion(m,q,hint,onWin){
  const fb=m.querySelector("#fb"),win=()=>onWin(fb);
  const lose=msg=>{fb.innerHTML=`<div class="feedback no">${msg}</div>`;};
  if(q.type==="mc"){
    m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===q.answer){b.classList.add("right");m.querySelectorAll(".opt").forEach(x=>x.disabled=true);win();}
      else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");b.disabled=true;
        const why=q.why&&q.why[i];lose(why?`<b>這個選項不太對。</b>${esc(why)}`:hint);}
    });
  } else {
    const pool=m.querySelector("#pool"),slot=m.querySelector("#slot");let order=[];const sh=shuffle(q.tokens);
    const draw=()=>{
      pool.innerHTML=sh.map((t,i)=>`<button class="tk" data-i="${i}" ${order.includes(i)?"disabled":""}>${esc(t)}</button>`).join("");
      slot.innerHTML=order.length?order.map((i,k)=>`<button class="tk" data-k="${k}">${esc(sh[i])}</button>`).join(""):`<span style="color:var(--muted);font-size:13px">點下方的詞卡，依序放進來</span>`;
      pool.querySelectorAll(".tk").forEach(b=>b.onclick=()=>{order.push(+b.dataset.i);draw();});
      slot.querySelectorAll(".tk").forEach(b=>b.onclick=()=>{order.splice(+b.dataset.k,1);draw();});
    };draw();
    m.querySelector("#clr").onclick=()=>{order=[];draw();fb.innerHTML="";};
    m.querySelector("#chk").onclick=()=>{
      if(order.length<q.tokens.length)return lose(`還有 ${q.tokens.length-order.length} 張詞卡沒放進去。`);
      const got=order.map(i=>sh[i]);
      if(got.join("|")===q.tokens.join("|")){m.querySelector("#chk").disabled=true;win();return;}
      const right=got.filter((t,k)=>t===q.tokens[k]).length;
      lose(`<b>有 ${right} 張的位置是對的。</b>${esc(q.hint||hint)}`);
    };
  }
}

  const first=!prog.games[gm.id];prog.games[gm.id]=true;save();

// 句型拉霸機：人＋做某事＋不（p.196）
const SLOT={
  reels:[["弟弟","哥哥","媽媽"],["睡覺","吃飯 按時","服藥 按時","去 菜市場 菜 買","去 菜市場 魚 買"],["不","要","不一樣"]],
  names:["人","做某事","結尾"],
  rounds:[{zh:"弟弟不睡覺。",ans:["弟弟","睡覺","不"]},{zh:"弟弟不按時吃飯。",ans:["弟弟","吃飯 按時","不"]},{zh:"哥哥不去菜市場買魚。",ans:["哥哥","去 菜市場 魚 買","不"]}],
  tips:["先看句子的主角是誰。","看清楚題目要做的是哪一件事；「按時」放在動作之後（吃飯 按時），買的是菜還是魚也要分清楚。","表達沒有意願，句型是「人＋做某事＋不」；「要」是叮嚀句型的結尾，「不一樣」是比較個性或興趣的句型。"]
};
function gameSlot(gm){
  let round=0;const idx=[2,3,1];
  const m=modal(gameHead(gm,"句型：人＋做某事＋不")+`<div class="bubble">弟弟生病好幾天了，還是不按時吃藥：「弟弟 服藥 按時 不」。換掉人物和動作，就能說出新的句子！</div><div class="q" id="sq"></div><div class="reels" id="reels"></div><div class="row"><button class="btn ghost" id="spin">拉一下</button><button class="btn" id="chk">確認</button></div><div id="fb"></div>`);
  m.querySelector(".close").onclick=closeModal;
  const fb=m.querySelector("#fb"),reels=m.querySelector("#reels");
  const draw=()=>{
    m.querySelector("#sq").innerHTML=`第 ${round+1}/${SLOT.rounds.length} 題：用臺灣手語說「${esc(SLOT.rounds[round].zh)}」<br><span style="font-size:13px;color:var(--muted);font-weight:400">按 ▲▼ 換詞，或先拉一下碰碰運氣。</span>`;
    reels.innerHTML=SLOT.reels.map((r,k)=>`<div class="reel"><button data-k="${k}" data-d="-1" aria-label="${SLOT.names[k]}上一個">▲</button><div class="win" id="w${k}">${esc(r[idx[k]])}</div><button data-k="${k}" data-d="1" aria-label="${SLOT.names[k]}下一個">▼</button><small>${SLOT.names[k]}</small></div>`).join("");
    reels.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,n=SLOT.reels[k].length;idx[k]=(idx[k]+(+b.dataset.d)+n)%n;m.querySelector("#w"+k).textContent=SLOT.reels[k][idx[k]];fb.innerHTML="";});
  };
  draw();
  m.querySelector("#spin").onclick=()=>{
    const ws=[0,1,2].map(k=>m.querySelector("#w"+k));ws.forEach(w=>w.classList.add("spin"));fb.innerHTML="";let ticks=0;
    const iv=setInterval(()=>{ticks++;[0,1,2].forEach(k=>{if(ticks<8+k*4){idx[k]=Math.floor(Math.random()*SLOT.reels[k].length);ws[k].textContent=SLOT.reels[k][idx[k]];}else ws[k].classList.remove("spin");});if(ticks>=16)clearInterval(iv);},70);
  };
  m.querySelector("#chk").onclick=()=>{
    const R=SLOT.rounds[round],got=idx.map((v,k)=>SLOT.reels[k][v]),bad=got.findIndex((v,k)=>v!==R.ans[k]);
    if(bad>=0){fb.innerHTML=`<div class="feedback no">「${SLOT.names[bad]}」這一格還不對。${SLOT.tips[bad]}</div>`;return;}
    round++;
    if(round>=SLOT.rounds.length){m.querySelector("#chk").disabled=m.querySelector("#spin").disabled=true;gameWin(gm,fb,"句型「人＋做某事＋不」表達某人沒有意願做某事。替換人物、動作或地點，就能在相似情境中類推。（p.196）");}
    else{fb.innerHTML=`<div class="feedback ok"><b>答對了！</b>「${esc(got.join(" "))}」。準備下一題。</div>`;setTimeout(()=>{if(m.isConnected)draw();},900);}
  };
}

// 連連看：華語詞組 ↔ 臺灣手語表達（p.193–194、p.204）
const PAIRS=[["辛苦地工作","工作 辛苦"],["輕鬆地工作","工作 輕鬆"],["努力地讀書","讀書 努力"],["減肥","減 瘦"],["老家","出生 家"],["你的手語名字是什麼？","你 臉 誰？"]];
function gameMatch(gm){
  const right=shuffle(PAIRS.map((_,i)=>i)),done=new Set(),colors=["#DB6A41","#1F6FD1","#3E9B5A","#E25C9A","#7D4CB7","#F07F1A"];let sel=null;
  const m=modal(gameHead(gm,"華語詞組 ↔ 臺灣手語表達")+`<div class="bubble">左邊是華語，右邊是臺灣手語的表達。先點左邊一張，再點右邊和它配對的那張。</div><div class="match" id="mt"><svg id="mlines" aria-hidden="true"></svg><div class="mcol">${PAIRS.map((p,i)=>`<button class="mcell" data-l="${i}">${esc(p[0])}</button>`).join("")}</div><div class="mcol">${right.map(i=>`<button class="mcell" data-r="${i}">${esc(PAIRS[i][1])}</button>`).join("")}</div></div><div id="fb"></div>`);
  m.querySelector(".close").onclick=closeModal;
  const mt=m.querySelector("#mt"),svg=m.querySelector("#mlines"),fb=m.querySelector("#fb");
  const lines=()=>{const b=mt.getBoundingClientRect();svg.setAttribute("viewBox",`0 0 ${b.width} ${b.height}`);
    svg.innerHTML=[...done].map(i=>{const l=mt.querySelector(`[data-l="${i}"]`).getBoundingClientRect(),r=mt.querySelector(`[data-r="${i}"]`).getBoundingClientRect();
      return `<line x1="${l.right-b.left}" y1="${l.top+l.height/2-b.top}" x2="${r.left-b.left}" y2="${r.top+r.height/2-b.top}" stroke="${colors[i]}" stroke-width="3.5" stroke-linecap="round"/>`;}).join("");};
  mt.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(done.has(+b.dataset.l))return;mt.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.l;fb.innerHTML="";});
  mt.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.r;if(done.has(i))return;
    if(sel===null){fb.innerHTML=`<div class="feedback no">先點左邊的華語，再點右邊配對的手語表達。</div>`;return;}
    if(i===sel){
      done.add(i);[mt.querySelector(`[data-l="${i}"]`),b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.style.borderColor=colors[i];});sel=null;lines();fb.innerHTML="";
      if(done.size===PAIRS.length)gameWin(gm,fb,"修飾動作狀態的詞可放在動作之後（工作 辛苦、讀書 努力）；「減 瘦」「出生 家」「你 臉 誰？」則顯示兩種語言取用的概念面向不同。（p.194、p.204）");
    } else {b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");fb.innerHTML=`<div class="feedback no">這兩張不是一對。想想「${esc(PAIRS[sel][0])}」在臺灣手語裡怎麼表達。</div>`;}
  });
}

// 對話練習：兄弟個性不一樣（p.197–198）
const TALK=[
  {ctx:"媽媽帶著兩個兒子在路上遇到朋友。你扮演媽媽，先介紹孩子。",opts:[["他們兩個 我 兒子。",""],["哥哥 隨性，弟弟 害羞。","這句是在回答「誰比較害羞」，朋友還沒有問；現在要先介紹孩子。"],["他們兩個 害羞 誰？","這是朋友等一下才會問的問題，現在要先介紹孩子。"]]},
  {them:"他們兩個 看起來 個性 一樣。",opts:[["不，哥哥 弟弟 他們兩個 個性 不一樣。",""],["哥哥 弟弟 個性 一樣。","情境裡兄弟的個性其實不一樣，媽媽要澄清。"],["他們兩個 我 兒子。","孩子已經介紹過了，要回應朋友說的「看起來個性一樣」。"]]},
  {them:"他們兩個 害羞 誰？",opts:[["哥哥 隨性，弟弟 害羞。",""],["哥哥 害羞，弟弟 害羞。","兩個都害羞，就不是「個性不一樣」了。"],["不，他們兩個 一樣。","朋友問的是誰比較害羞，要說出是誰。"]]},
  {ctx:"替換練習：換成姊姊和妹妹，說她們兩人的興趣不一樣。",opts:[["姊姊 妹妹 他們兩個 興趣 不一樣。",""],["姊姊 妹妹 興趣 他們兩個 不一樣。","和本章的句型順序不同。句型是：人1＋人2＋他們兩個＋個性／興趣＋不一樣。"],["興趣 不一樣 姊姊 妹妹。","先說人物，再說「他們兩個」，最後才是興趣和「不一樣」。"]]}
];
function gameTalk(gm){
  let step=0;
  const m=modal(gameHead(gm,"媽媽與朋友的對話")+`<div class="chat" id="chat"></div><div class="q" id="tq" style="font-size:14px">你（媽媽）要怎麼回？</div><div class="opts" id="topts"></div><div id="fb"></div>`);
  m.querySelector(".close").onclick=closeModal;
  const chat=m.querySelector("#chat"),opts=m.querySelector("#topts"),fb=m.querySelector("#fb");
  const add=(cls,who,text)=>{chat.insertAdjacentHTML("beforeend",`<div class="say ${cls}">${who?`<small>${who}</small>`:""}${esc(text)}</div>`);chat.scrollTop=chat.scrollHeight;};
  const show=()=>{
    const s=TALK[step];
    if(s.ctx)add("ctx","",s.ctx);
    if(s.them)add("them","朋友",s.them);
    const order=shuffle(s.opts.map((_,i)=>i));
    opts.innerHTML=order.map(i=>`<button class="opt" data-i="${i}">${esc(s.opts[i][0])}</button>`).join("");
    opts.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i!==0){b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");fb.innerHTML=`<div class="feedback no">${esc(s.opts[i][1])}</div>`;return;}
      fb.innerHTML="";opts.innerHTML="";add("me","媽媽（你）",s.opts[0][0]);step++;
      if(step>=TALK.length){m.querySelector("#tq").hidden=true;gameWin(gm,fb,"對話練習三步驟：說明對話情境 → 分配角色練習 → 替換人物、個性或興趣重新組合。學生在連續互動裡使用句型，而不只是會打單一句子。（p.198）");}
      else setTimeout(()=>{if(m.isConnected)show();},500);
    });
  };
  show();
}

// 語句拆合：我的家人（p.199–200）
const SPLIT=[
  {q:"爸爸辛苦地做什麼？",ans:["爸爸","工作","辛苦"],extra:["讀書"],why:"引出人物＋動作＋情形",pat:"某人＋做某事＋情形"},
  {q:"媽媽呢？",ans:["媽媽","工作","辛苦"],extra:["爸爸"],why:"替換人物",pat:"某人＋做某事＋情形"},
  {q:"爸爸媽媽呢？",ans:["爸爸","媽媽","工作","辛苦"],extra:["努力"],why:"合併人物",pat:"某人＋做某事＋情形"},
  {q:"哥哥努力地做什麼？",ans:["哥哥","讀書","努力"],extra:["工作"],why:"引出第二組句子",pat:"某人＋做某事＋情形"},
  {q:"你要對爸爸媽媽哥哥姊姊說什麼？",ans:["我","愛","你們"],extra:["辛苦"],why:"引出情感表達",pat:"某人＋愛＋某人"}
];
function gameSplit(gm){
  let step=0,pick=[],pool=[];const built=[];
  const m=modal(gameHead(gm,"我的家人")+`<div class="bubble" id="sp-q"></div><div class="slot" id="slot"></div><div class="pool" id="pool"></div><div class="row"><button class="btn" id="chk">回答</button><button class="btn ghost" id="clr">重排</button></div><div class="text-build" id="tb"><b>拼出來的句子</b></div><div id="fb"></div>`);
  m.querySelector(".close").onclick=closeModal;
  const fb=m.querySelector("#fb"),slot=m.querySelector("#slot"),poolEl=m.querySelector("#pool"),tb=m.querySelector("#tb");
  const drawTokens=()=>{
    poolEl.innerHTML=pool.map((t,i)=>`<button class="tk" data-i="${i}" ${pick.includes(i)?"disabled":""}>${esc(t)}</button>`).join("");
    slot.innerHTML=pick.length?pick.map((i,k)=>`<button class="tk" data-k="${k}">${esc(pool[i])}</button>`).join(""):`<span style="color:var(--muted);font-size:13px">點下方詞卡回答；有一張是多出來的</span>`;
    poolEl.querySelectorAll(".tk").forEach(b=>b.onclick=()=>{pick.push(+b.dataset.i);drawTokens();});
    slot.querySelectorAll(".tk").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.k,1);drawTokens();});
  };
  const drawStep=()=>{
    const s=SPLIT[step];pick=[];pool=shuffle(s.ans.concat(s.extra));
    m.querySelector("#sp-q").innerHTML=`<b>老師（${step+1}/${SPLIT.length}）：</b>${esc(s.q)}`;drawTokens();
  };
  const drawBuilt=(fresh)=>{tb.innerHTML=`<b>拼出來的句子</b>`+built.map((t,k)=>`<span class="${fresh&&k===built.length-1?"new":""}">${esc(t)}</span>`).join("");};
  drawStep();
  m.querySelector("#clr").onclick=()=>{pick=[];drawTokens();fb.innerHTML="";};
  m.querySelector("#chk").onclick=()=>{
    const s=SPLIT[step],got=pick.map(i=>pool[i]);
    if(got.join(" ")!==s.ans.join(" ")){fb.innerHTML=`<div class="feedback no">${got.some(t=>s.extra.includes(t))?"有一張多出來的詞卡被放進去了。":"順序或內容還不對。"}這一句的句型是「${s.pat}」（p.199）。</div>`;return;}
    built.push(s.ans.join(" "));drawBuilt(true);fb.innerHTML=`<div class="feedback ok"><b>對了！</b>這一步的目的：${esc(s.why)}。</div>`;step++;
    if(step>=SPLIT.length){
      m.querySelector("#chk").disabled=m.querySelector("#clr").disabled=true;slot.innerHTML="";poolEl.innerHTML="";m.querySelector("#sp-q").innerHTML="<b>完整課文</b>（加上姊姊）";
      tb.innerHTML=`<b>完整課文 · 臺灣手語文本（p.193）</b><span class="new">爸爸 媽媽 工作 辛苦，</span><span class="new">哥哥 姊姊 讀書 努力。</span><span class="new">爸爸 媽媽 哥哥 姊姊，</span><span class="new">我 愛 你們。</span>`;
      gameWin(gm,fb,"這種方式稱為「語句拆合」：先把較長的句子拆成容易回答的小單位，再逐步合併成完整課文。學生不只是模仿，而是在情境中理解、回答、組合與表達。（p.200）");
    } else setTimeout(()=>{if(m.isConnected)drawStep();},700);
  };
}

// shown on every visit until the viewer opts out; bump when the guide gains pages so everyone sees it again
const TUT_VER=5;
function tutorial(k){
  const p=TUT[k];
  const m=modal(`<div class="eyebrow">玩法說明 ${k+1}/${TUT.length}</div><h3 class="sec-title" style="margin-top:6px">${p.t}</h3><p class="prose" style="margin-top:6px;color:var(--muted);font-size:14px">${p.intro}</p>
    <ul class="tut-list">${p.items.map(([ic,h,d])=>`<li><span class="tut-ic" aria-hidden="true">${ic}</span><div><b>${h}</b><span>${d}</span></div></li>`).join("")}</ul>
    ${p.foot?`<p class="tut-foot">${p.foot}</p>`:""}
    <div class="tut-dots">${TUT.map((_,i)=>`<i class="${i===k?"on":""}"></i>`).join("")}</div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--muted)"><input type="checkbox" id="tutOff" ${prog.tut===TUT_VER?"checked":""}> 下次進來不要自動顯示</label>
    <div class="row" style="justify-content:flex-end">${k>0?`<button class="btn ghost" id="pv">上一步</button>`:`<button class="btn ghost" id="sk">略過</button>`}${p.last?`<button class="btn ghost" id="sk2">自己逛逛</button><button class="btn" id="go">從政策港開始</button>`:`<button class="btn" id="nx">下一步</button>`}</div>`);
  m.querySelector("#tutOff").onchange=e=>{prog.tut=e.target.checked?TUT_VER:false;save();};
  const on=(id,f)=>{const b=m.querySelector(id);if(b)b.onclick=f;};
  on("#sk",closeModal);on("#sk2",closeModal);
  on("#pv",()=>tutorial(k-1));on("#nx",()=>tutorial(k+1));
  on("#go",()=>{closeModal();openIsland(0);focusIsland(0);});
}
